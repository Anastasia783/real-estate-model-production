name: real-estate-model-production


services:
  ml_service:
    build:
      context: .
      dockerfile: Dockerfile_ml_service
    image: real-estate-ml-service:compose
    container_name: ml_service
    env_file:
      - services/.env
    ports:
      - "127.0.0.1:${ML_SERVICE_HOST_PORT:-8000}:8000"
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    depends_on:
      - ml_service
    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped


volumes:
  prometheus_data:
  grafana_data: